name: Build Linux executable

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies for PyQt6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libfontconfig1 libxkbcommon0 libdbus-1-3

      - name: Build aria2 from source for bundling
        run: |
          sudo apt-get install -y build-essential autoconf automake autopoint libtool pkg-config intltool gettext zlib1g-dev libssl-dev libc-ares-dev libxml2-dev
          wget -q https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.gz
          tar xzf aria2-1.37.0.tar.gz
          cd aria2-1.37.0
          ./configure --disable-shared --enable-static --without-libssh2
          make -j"$(nproc)"
          mkdir -p ../tools
          cp src/aria2c ../tools/aria2c
          cd ..

      - name: Download 7-Zip for bundling
        run: |
          wget -q https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz
          mkdir -p 7z2602
          tar -xJf 7z2602-linux-x64.tar.xz -C 7z2602
          mkdir -p tools
          cp "$(find 7z2602 -type f -name 7zz | head -n 1)" tools/7zz

      - name: Install dependencies
        run: ./scripts/setup.sh

      - name: Run checks
        run: ./scripts/check.sh
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build executable
        run: ./scripts/build.sh

      - name: Release the Package
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Linua-Updater