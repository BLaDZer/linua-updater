name: Build Windows EXE

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: scripts\setup.bat

      - name: Run checks
        run: scripts\check.bat

      - name: Download aria2 for bundling
        run: |
          $aria2Url = "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip"
          $zipPath = "$env:RUNNER_TEMP\aria2.zip"
          Invoke-WebRequest -Uri $aria2Url -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\aria2" -Force
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Copy-Item "$env:RUNNER_TEMP\aria2\aria2-1.37.0-win-64bit-build1\aria2c.exe" -Destination "tools\aria2c.exe" -Force

      - name: Download 7-Zip for bundling
        run: |
          $sevenBaseUrl = "https://github.com/ip7z/7zip/releases/download/26.02"
          $sevenTemp = "$env:RUNNER_TEMP\7z"
          New-Item -ItemType Directory -Force -Path $sevenTemp | Out-Null
          Invoke-WebRequest -Uri "$sevenBaseUrl/7zr.exe" -OutFile "$sevenTemp\7zr.exe" -UseBasicParsing
          Invoke-WebRequest -Uri "$sevenBaseUrl/7z2602-extra.7z" -OutFile "$sevenTemp\7z2602-extra.7z" -UseBasicParsing
          & "$sevenTemp\7zr.exe" x "$sevenTemp\7z2602-extra.7z" "-o$sevenTemp" -y | Out-Null
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Copy-Item "$sevenTemp\x64\7za.exe" -Destination "tools\7z.exe" -Force

      - name: Build EXE
        run: scripts\build.bat

      - name: Release the Package
        uses: softprops/action-gh-release@v2
        with:
          files: dist\\Linua-Updater.exe